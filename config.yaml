# Target server settings (Docker Compose network service name is 'server')
target_url: "https://www.test.local" # Fallback if direct DNS resolution is not used

# Experimental DNS and domain configuration
dns_server: "192.168.128.53:53"
target_domain: "www.test.local"
target_port: 443

# Device profile setting (Optional. If omitted, one will be selected randomly at start and kept consistent for the process)
# Available profiles: "iPhone / Safari", "iPad / Safari", "Mac / Safari", "Mac / Chrome", "Mac / Firefox", "Android / Chrome", "Android / Firefox", "Windows / Chrome", "Windows / Edge", "Windows / Firefox", "Linux / Chrome", "Linux / Firefox"
device_profile: ""

# Simulation parameters
duration_seconds: 15
vus_per_client: 1
think_time_ms: 1000

# Scenario definition: sequence of HTTP requests executed by each virtual user
scenario:
  - name: "Access Home Page"
    method: "GET"
    path: "/"
    expect_status: 200

