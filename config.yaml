# Target server settings (Docker Compose network service name is 'server')
target_url: "http://server:8080" # Fallback if direct DNS resolution is not used

# Experimental DNS and domain configuration
dns_server: "192.168.10.53:53"
target_domain: "www.v6d.dsm.cis.kit.jp"
target_port: 80

# Simulation parameters
duration_seconds: 15
vus_per_client: 3
think_time_ms: 1000

# Scenario definition: sequence of HTTP requests executed by each virtual user
scenario:
  - name: "Access Home Page"
    method: "GET"
    path: "/"
    expect_status: 200

  - name: "Submit Login"
    method: "POST"
    path: "/login"
    body: '{"username": "user_{{VU_ID}}", "password": "password123"}'
    headers:
      Content-Type: "application/json"
    expect_status: 200
    think_time_ms: 500

  - name: "Get Profile Data"
    method: "GET"
    path: "/profile"
    expect_status: 200
    think_time_ms: 800
