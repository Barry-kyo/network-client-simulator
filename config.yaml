# Target server settings (Docker Compose network service name is 'server')
target_url: "https://www.test.local" # Fallback if direct DNS resolution is not used

# Experimental DNS and domain configuration
dns_server: "[2001:2f8:31:f145::53]:53"
target_domain: "www.test.local"
target_port: 443

# Device profile setting (Optional. If omitted, one will be selected randomly at start and kept consistent for the process)
# Available profiles: "iPhone / Safari", "Android / Chrome", "Windows / Chrome", "Mac / Firefox"
device_profile: ""

# Simulation parameters
duration_seconds: 15
vus_per_client: 10
think_time_ms: 1000

# Scenario definition: sequence of HTTP requests executed by each virtual user
scenario:
  - name: "Access Home Page"
    method: "GET"
    path: "/"
    expect_status: 200

  - name: "Submit Login"
    method: "POST"
    path: "/login"
    body: '{"username": "user_{{VU_ID}}", "password": "password123"}'
    headers:
      Content-Type: "application/json"
    expect_status: 200
    think_time_ms: 500

  - name: "Get Profile Data"
    method: "GET"
    path: "/profile"
    expect_status: 200
    think_time_ms: 800
